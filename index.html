<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>焚城</title>
<style>
:root{
  --cold:#6fc9e8; --warm:#ffb456; --hot:#ff5722; --ember:#ffde7a;
  --ink:#f2e6d2; --soft:#a99a86; --line:rgba(255,255,255,.12);
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;
  --num:"Bahnschrift","DIN Alternate","Arial Narrow",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#04070c}
body{
  font-family:var(--serif);color:var(--ink);
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}
#c{position:fixed;inset:0;display:block}

/* ---------- HUD ---------- */
.hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.panel{
  position:absolute;background:rgba(6,9,14,.58);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:10px;padding:9px 13px;
}
#panelTemp{top:14px;left:14px;min-width:158px}
#panelStage{top:14px;right:14px;max-width:min(46vw,320px);text-align:right}
#panelRes{bottom:14px;left:14px;min-width:196px}

.label{font-size:10px;letter-spacing:.28em;color:var(--soft);margin-bottom:3px}
.temp{display:flex;align-items:baseline;gap:4px;line-height:1}
.temp b{font-family:var(--num);font-size:38px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;transition:color .35s}
.temp i{font-style:normal;font-size:15px;color:var(--soft)}
.sub{font-size:11px;color:var(--soft);margin-top:5px;letter-spacing:.06em}

.track{height:6px;border-radius:3px;background:rgba(255,255,255,.10);
  overflow:hidden;margin-top:8px;position:relative}
.track i{display:block;height:100%;width:0%;border-radius:3px;transition:width .18s linear}

#stageName{font-size:15px;letter-spacing:.12em;color:var(--warm)}
#stageGoal{font-size:11.5px;color:var(--soft);margin-top:4px;line-height:1.5}
#stageBar{margin-top:8px;margin-left:auto;width:150px}

.row{display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--soft);letter-spacing:.06em;margin-top:7px}
.row:first-of-type{margin-top:0}
.row b{font-family:var(--num);font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.mini{width:112px;height:5px;border-radius:3px;background:rgba(255,255,255,.10);overflow:hidden}
.mini i{display:block;height:100%;width:100%;border-radius:3px;transition:width .18s linear}
.row.lv{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px}
.row.lv span{font-family:var(--num);letter-spacing:.08em;color:var(--warm)}

/* ---------- 提示 / Toast ---------- */
#hint{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);
  z-index:6;pointer-events:none;font-size:13.5px;letter-spacing:.1em;
  padding:7px 16px;border-radius:20px;color:var(--ink);
  background:rgba(6,9,14,.66);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;transition:opacity .22s}
#hint.on{opacity:1}
#hint kbd{font-family:var(--num);font-size:12px;padding:1px 6px;margin-right:5px;
  border-radius:4px;background:rgba(255,255,255,.14);border:1px solid var(--line)}

#toast{position:fixed;left:50%;top:19%;transform:translate(-50%,-8px);z-index:7;
  pointer-events:none;font-size:17px;letter-spacing:.16em;text-align:center;
  padding:11px 26px;border-radius:8px;color:#fff2d8;
  background:rgba(24,10,4,.72);border:1px solid rgba(255,150,60,.34);
  box-shadow:0 0 40px rgba(255,110,30,.22);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;transition:opacity .3s,transform .3s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 遮罩 ---------- */
#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 620px at 50% 42%,rgba(30,10,2,.80),rgba(3,5,9,.96));
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  transition:opacity .5s;padding:24px;overflow-y:auto}
#overlay.hide{opacity:0;pointer-events:none}
.card{max-width:580px;width:100%;text-align:center;animation:rise .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.title{font-size:clamp(40px,9vw,68px);letter-spacing:.34em;text-indent:.34em;
  background:linear-gradient(100deg,#ffd479,#ff7a2f 52%,#d32b12);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(255,110,30,.34))}
.subtitle{margin-top:12px;font-size:13.5px;letter-spacing:.24em;color:var(--soft)}
.rule{margin:24px auto 0;max-width:470px;text-align:left;font-size:13px;
  line-height:1.95;color:#cfc0aa;letter-spacing:.05em}
.rule em{font-style:normal;color:var(--warm)}
.rule s{text-decoration:none;color:var(--hot)}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--hot);margin-right:9px;vertical-align:middle}
button{margin-top:28px;font-family:var(--serif);font-size:15px;letter-spacing:.24em;
  color:#160b04;cursor:pointer;padding:12px 40px;border:0;border-radius:6px;
  background:linear-gradient(180deg,#ffcb70,#ff8a30);
  box-shadow:0 10px 30px rgba(255,120,40,.24);transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(255,120,40,.36)}
button:active{transform:translateY(0)}
.final{font-family:var(--num);font-size:clamp(58px,15vw,104px);line-height:1;
  letter-spacing:-.03em;color:#ff8a3c;text-shadow:0 0 44px rgba(255,90,20,.5)}
.final i{font-style:normal;font-size:.36em;color:#ffab5e}

/* ---------- 木匠铺（室外） ---------- */
#shop{position:fixed;inset:0;z-index:16;display:flex;align-items:center;justify-content:center;
  background:rgba(4,6,10,.72);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  transition:opacity .25s;padding:20px}
#shop.hide{opacity:0;pointer-events:none}
.shopbox{width:min(580px,94vw);border:1px solid rgba(255,180,90,.28);border-radius:12px;
  background:linear-gradient(180deg,rgba(30,19,11,.97),rgba(15,10,6,.99));
  box-shadow:0 30px 90px rgba(0,0,0,.62);padding:18px 20px 16px}
.shoptop{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;
  border-bottom:1px dashed rgba(255,180,90,.24);padding-bottom:10px;margin-bottom:4px}
.shoptitle{font-size:17px;letter-spacing:.30em;color:var(--warm)}
.shopwallet{font-size:12px;color:var(--soft);letter-spacing:.08em}
.shopwallet b{font-family:var(--num);font-size:16px;color:var(--ink);margin:0 2px}
.srow{display:flex;align-items:center;gap:10px;padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.06)}
.sinfo{flex:1;min-width:0}
.sname{font-size:14px;letter-spacing:.12em;color:var(--ink)}
.slv{font-family:var(--num);font-size:12px;color:var(--warm);margin-left:4px}
.sdesc{font-size:11.5px;color:var(--soft);margin-top:3px;letter-spacing:.04em}
.sbtn{margin:0;font-family:var(--num);font-size:13px;letter-spacing:.06em;padding:8px 14px;
  border-radius:6px;border:0;cursor:pointer;color:#180c04;white-space:nowrap;
  background:linear-gradient(180deg,#ffcb70,#ff8a30);box-shadow:none}
.sbtn:hover{transform:none}
.sbtn.poor{background:linear-gradient(180deg,#6d5c48,#4a3d30);color:#c0ae99}
.sbtn:disabled{background:linear-gradient(180deg,#3a332b,#2a251f);color:#6b6157;cursor:default}
.smax{font-size:12px;color:var(--soft);letter-spacing:.2em;padding-right:6px}
#btnShopClose{display:block;width:100%;margin-top:14px;font-size:14px;letter-spacing:.24em;
  padding:11px;border-radius:6px;background:rgba(255,255,255,.07);color:var(--ink);
  border:1px solid var(--line);box-shadow:none}
#btnShopClose:hover{background:rgba(255,255,255,.12);transform:none}

/* ---------- 触屏 ---------- */
#touch{position:fixed;inset:0;z-index:8;pointer-events:none;display:none}
#touch button{position:absolute;bottom:22px;margin:0;padding:0;width:66px;height:66px;
  border-radius:50%;font-size:20px;letter-spacing:0;pointer-events:auto;
  background:rgba(9,12,18,.6);color:var(--ink);border:1px solid var(--line);
  box-shadow:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#btnL{left:18px}#btnR{left:100px}
#btnE{right:18px;background:linear-gradient(180deg,rgba(255,203,112,.92),rgba(255,138,48,.92));color:#180c04}
@media (pointer:coarse){#touch{display:block}}
@media (max-width:720px){
  #panelTemp{min-width:126px;padding:7px 10px;top:10px;left:10px}
  .temp b{font-size:29px}
  #panelStage{max-width:52vw;padding:7px 10px;top:10px;right:10px}
  #stageName{font-size:13px}#stageGoal{font-size:10.5px}
  #panelRes{bottom:104px;left:10px;min-width:158px;padding:7px 10px}
  .mini{width:82px}
  #hint{bottom:150px;font-size:12px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="panel" id="panelTemp">
    <div class="label">室内温度</div>
    <div class="temp"><b id="tempVal">2.0</b><i>°C</i></div>
    <div class="track"><i id="tempBar" style="background:linear-gradient(90deg,#4aa8d8,#ffb456)"></i></div>
    <div class="sub" id="outTemp">室外 -8.0°C</div>
  </div>

  <div class="panel" id="panelStage">
    <div id="stageName">一 · 取暖</div>
    <div id="stageGoal">把室内温度升到 20°C</div>
    <div class="track" id="stageBar"><i id="stageBarFill" style="background:linear-gradient(90deg,#ff8a30,#ffd479)"></i></div>
  </div>

  <div class="panel" id="panelRes">
    <div class="row"><span>木料</span><b id="woodVal">0</b></div>
    <div class="row"><span>钱</span><b id="moneyVal">0</b></div>
    <div class="row"><span>体力</span><div class="mini"><i id="staBar" style="background:linear-gradient(90deg,#7fd6a0,#c9f0b8)"></i></div></div>
    <div class="row"><span>体温</span><div class="mini"><i id="hpBar" style="background:linear-gradient(90deg,#ff7a5c,#ffd08a)"></i></div></div>
    <div class="row lv"><span id="axeLv">斧 Lv.1</span><span id="bootLv">靴 Lv.1</span></div>
  </div>
</div>

<div id="hint"><kbd>E</kbd><span id="hintText"></span></div>
<div id="toast"></div>

<div id="touch">
  <button id="btnL">&#9664;</button>
  <button id="btnR">&#9654;</button>
  <button id="btnE">E</button>
</div>

<div id="shop" class="hide">
  <div class="shopbox">
    <div class="shoptop">
      <span class="shoptitle">木 料 收 购 站</span>
      <span class="shopwallet">木料 <b id="shopWood">0</b> · 钱 <b id="shopMoney">0</b></span>
    </div>
    <div id="shopBody"></div>
    <button id="btnShopClose">离 开</button>
  </div>
</div>

<div id="overlay">
  <div class="card" id="card">
    <div class="title">焚 城</div>
    <div class="subtitle">从一根柴火开始</div>
    <div class="rule">
      <div><span class="dot"></span>往右是林子。<em>越远的树越硬，木料成倍地多</em></div>
      <div><span class="dot"></span>房子<em>左边</em>的收购站收木料，换钱买斧头和靴子</div>
      <div><span class="dot"></span>按住 <em>E</em> 可以把木料连着倒进壁炉，越投越快</div>
      <div><span class="dot"></span>室外会冻僵；<em>温度越高越难往上顶</em></div>
      <div><span class="dot"></span>烧到 <s>500°C</s> 木屋会被烧穿</div>
    </div>
    <button id="btnStart">开 始</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   0. 工具
   ============================================================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha:false });
const $ = id => document.getElementById(id);

// roundRect 兜底（Chrome<99 / 旧 Safari）：原型和实例都挂一份
if (typeof ctx.roundRect !== 'function'){
  const rr = function(x,y,w,h,r){
    if (typeof r === 'number') r = [r,r,r,r];
    const m = Math.min(w,h)/2;
    r = r.map(v => Math.min(v, m));
    this.moveTo(x+r[0], y);
    this.lineTo(x+w-r[1], y);
    this.quadraticCurveTo(x+w, y, x+w, y+r[1]);
    this.lineTo(x+w, y+h-r[2]);
    this.quadraticCurveTo(x+w, y+h, x+w-r[2], y+h);
    this.lineTo(x+r[3], y+h);
    this.quadraticCurveTo(x, y+h, x, y+h-r[3]);
    this.lineTo(x, y+r[0]);
    this.quadraticCurveTo(x, y, x+r[0], y);
    return this;
  };
  try { CanvasRenderingContext2D.prototype.roundRect = rr; } catch(e){}
  try { ctx.roundRect = rr; } catch(e){}
}

const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const lerp  = (a,b,t) => a+(b-a)*t;
const rnd   = (a,b) => a+Math.random()*(b-a);
const mixc  = (c1,c2,t) => 'rgb('+Math.round(lerp(c1[0],c2[0],t))+','+
                                   Math.round(lerp(c1[1],c2[1],t))+','+
                                   Math.round(lerp(c1[2],c2[2],t))+')';

let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  // innerWidth/Height 偶发取到 0（隐藏、会话恢复、打印预览）会让画布变成 0 尺寸而全黑
  const vw = window.innerWidth  || document.documentElement.clientWidth  || 960;
  const vh = window.innerHeight || document.documentElement.clientHeight || 640;
  W = Math.max(320, Math.round(vw));
  H = Math.max(240, Math.round(vh));
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  S.groundY = H*0.80;
  if (S.scene === 'indoor') S.player.x = clamp(S.player.x, 70, Math.max(80, W-70));
  buildTowers();
}
addEventListener('resize', resize);

/* ============================================================
   1. 世界常量
   ============================================================ */
const WORLD_W   = 7200;                       // 森林纵深
const HOUSE_L   = 480, HOUSE_R = 820, HOUSE_W = HOUSE_R - HOUSE_L;
const DOOR_X    = (HOUSE_L+HOUSE_R)/2;
const SHOP_X    = 330;                        // 收购站挪近些，站在门口就能看见
const VILLAGE_X = 716;                        // 出生点：紧挨大门右侧
const TREE_NEAR = 1060;                       // 第一棵树
const FONT_S    = '"Songti SC","Noto Serif SC","STSong",serif';
const FONT_N    = '"Bahnschrift","DIN Alternate",sans-serif';

// 四个投柴节点：60 根 -> 15°C，300 根 -> 60°C，2000 根 -> 200°C，10000 根 -> 500°C
const THRESH = { warm:15, smoke:60, burn:200, blaze:500, xian:60 };
const PH_BURN = 5;         // 从这一阶段起屋子已烧穿，只剩观赏
const REACH_DOOR  = 105;   // 门口
const REACH_FIRE  = 145;   // 壁炉（与门口刻意不重叠）
const REACH_SHOP  = 120;   // 收购站

const K_ON = 0.13, K_OFF = 0.07;
// 直接把「累计投柴 -> 目标室温」画成折线，四个节点精确命中。
// 之前用单一公式拟合，四个约束两个自由度拟合不上，还会因渐近逼近卡在阈值下方。
const HEAT_CURVE = [
  { n:0,     t:-8 },
  { n:60,    t:15 },
  { n:300,   t:60 },
  { n:2000,  t:200 },
  { n:10000, t:500 }
];
function heatTarget(n){
  if (n <= HEAT_CURVE[0].n) return HEAT_CURVE[0].t;
  for (let i=1;i<HEAT_CURVE.length;i++){
    const a = HEAT_CURVE[i-1], b = HEAT_CURVE[i];
    if (n <= b.n) return lerp(a.t, b.t, (n - a.n) / (b.n - a.n));
  }
  const last = HEAT_CURVE[HEAT_CURVE.length-1];
  return last.t + (n - last.n) * 0.05;
}
const FUEL_PER_WOOD = 10, BURN_RATE = 0.25, FUEL_MAX = 120000;

const STAMINA_MAX = 260, STAMINA_CHOP = 4, STAMINA_FREEZE = 118;
// 森林纵深拉长后单程距离翻倍，寒冷速率要相应放缓，
// 否则还没走到中林就开始掉体温，出门就只剩「赶紧跑回来」这一种玩法。
// 体温条空了（寒冷满）就该进入倒计时：掉血必须快到和「条已见底」相称，
// 之前 2.5/s 意味着条空了还能晃 40 秒，反馈完全对不上。
const COLD_RATE = 2.0, COLD_HURT = 8;
const BASE_SPEED = 176;

// 林地共六带：前三带是原本的数值，后面续三带更硬更肥
const TREE_ZONES = [
  // shape: 0 尖松 / 1 圆冠 / 2 宽冠 / 3 双干 / 4 伞形 / 5 塔形
  // pal 按人眼亮度逐档变暗（52 -> 49 -> 43 -> 42 -> 38 -> 25），
  // 保证「越深越暗」读得出来；之前雾林比近林还亮，层次是乱的。
  { name:'近林', to:2100,  hp:4,  yield:16,   scale:1.00, layers:3, pal:[34,62,48], shape:0 },
  { name:'中林', to:3200,  hp:8,  yield:60,   scale:1.24, layers:3, pal:[28,58,54], shape:1 },
  { name:'深林', to:4300,  hp:16, yield:200,  scale:1.52, layers:4, pal:[22,50,58], shape:2 },
  { name:'老林', to:5400,  hp:32, yield:560,  scale:1.78, layers:4, pal:[30,46,50], shape:3 },
  { name:'雾林', to:6400,  hp:48, yield:1500, scale:2.05, layers:5, pal:[34,36,56], shape:4 },
  { name:'黑林', to:99999, hp:64, yield:4000, scale:2.35, layers:5, pal:[24,22,42], shape:5 }
];
function zoneAt(x){
  for (let i=0;i<TREE_ZONES.length;i++) if (x < TREE_ZONES[i].to) return TREE_ZONES[i];
  return TREE_ZONES[TREE_ZONES.length-1];
}

const WOOD_PRICE = 15;
// 装备从 Lv.0 起步，**等级本身没有上限**——唯一的闸门是「每个阶段每种最多升两级」。
// 一共四个投柴阶段，所以实际能练到 Lv.8。
// 价格随等级递增，效果线性增长：斧每级 +0.5×，靴每级 +25%。
const GEAR = [
  { key:'axe',  name:'伐木斧', desc:'每下一斧的木料',
    cost: function(lv){ return Math.round(250 * Math.pow(1.30, lv)); },
    label: function(lv){ const m = 1 + lv*0.5; return (m % 1 === 0 ? m : m.toFixed(1)) + '×'; } },
  { key:'boot', name:'雪地靴', desc:'移动速度',
    cost: function(lv){ return Math.round(200 * Math.pow(1.30, lv)); },
    label: function(lv){ return Math.round((1 + lv*0.25)*100) + '%'; } }
];

/* ============================================================
   2. 状态
   ============================================================ */
const S = {
  started:false, over:false, won:false, t:0,
  scene:'outdoor',                 // outdoor | indoor | xian
  phase:1,
  groundY:0, camX:0, shake:0, flash:0,

  wood:0, stamina:STAMINA_MAX, cold:0, health:100,
  inTemp:2, outTemp:-8, totalWood:0, fuel:0,
  forestFire:0, xianTemp:15, xianBoost:0,

  money:0, axe:0, boot:0,          // 收购站升级（Lv.0 起步）
  upLeft:{ axe:2, boot:2 },        // 本阶段每种装备还剩几次升级机会
  xianCin:false,
  chopped:0,                       // 累计伐木量
  paused:false,                    // 商店打开时暂停

  ct:0,                            // 动作冷却
  feedCd:0, holdE:false, holdT:0,  // 长按连续投柴
  feedCount:0,                     // 本次连投已投几根（决定投柴节奏）
  clickFeed:false,                 // 鼠标点壁炉后自动转入连投
  cine:null,
  auto:null,
  woodFx:0,                        // 投柴动画节流

  player:{ x:VILLAGE_X, vx:0, face:1, walk:0, chop:0, hurt:0 },
  trees:[], parts:[], snow:[], stars:[], hills:[], towers:[],
  keys:{},
};

function makeTree(x){
  const z = zoneAt(x);
  const s = z.scale;
  return {
    x, zone:z,
    rate: z.yield / z.hp,     // 每下一斧的基础木料
    stock: z.yield,           // 这棵树一共能出多少木料
    pending: 0,               // 已经砍下、但要等树倒才归你的木料
    h:(150+Math.random()*95)*s, w:(78+Math.random()*46)*s,
    hp:z.hp, maxHp:z.hp, stump:0, shake:0, burn:0, lit:0, seed:Math.random()*100
  };
}
function buildTowers(){
  S.towers = [];
  if (W < 10 || H < 10) return;
  let tx = -60;
  while (tx < W+420){
    const tw = rnd(38,92), th = rnd(H*0.14, H*0.52);
    const win = [];
    for (let wy=0; wy<th-22; wy+=17)
      for (let wx=6; wx<tw-11; wx+=14)
        if (Math.random()>0.30) win.push({x:wx,y:wy});
    S.towers.push({ x:tx, w:tw, h:th, win });
    tx += tw + rnd(6,30);
  }
}
function buildWorld(){
  S.trees = [];
  let x = TREE_NEAR;
  while (x < WORLD_W-140){
    S.trees.push(makeTree(x));
    const zi = TREE_ZONES.indexOf(zoneAt(x));
    x += (132+Math.random()*72) * (1 + zi*0.13);   // 越深的林子越稀疏
  }

  S.snow = [];
  for (let i=0;i<300;i++) S.snow.push({
    x:Math.random()*WORLD_W, y:Math.random()*Math.max(1,H),
    r:rnd(0.8,2.6), s:rnd(14,46), d:rnd(0,Math.PI*2)
  });

  S.stars = [];
  for (let i=0;i<400;i++) S.stars.push({
    x:Math.random()*WORLD_W, y:Math.random()*H*0.55,
    r:rnd(0.5,1.7), a:rnd(.25,.95), p:Math.random()*Math.PI*2
  });

  S.hills = [];
  for (let l=0;l<3;l++){
    const pts=[]; let hx=-200;
    while (hx < WORLD_W+400){
      pts.push({ x:hx, y:H*(0.44+l*0.075) - rnd(30,120)*(1-l*0.22) });
      hx += rnd(180,320);
    }
    S.hills.push(pts);
  }
  buildTowers();
}

/* ============================================================
   3. 粒子
   ============================================================ */
// 火焰/烟雾预渲染成精灵：此前每个粒子每帧都新建 radialGradient，
// 是纯 CPU 的高频重活，也是压垮渲染进程、导致画面冻结/黑屏的主因。
const SPR = {};
function mkGlow(size, stops){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const r = size/2;
  const rg = g.createRadialGradient(r,r,0,r,r,r);
  for (const s of stops) rg.addColorStop(s[0], s[1]);
  g.fillStyle = rg;
  g.fillRect(0,0,size,size);
  return c;
}
function buildSprites(){
  SPR.fireHot = mkGlow(64, [[0,'rgba(255,248,224,1)'],[0.28,'rgba(255,206,110,0.66)'],
                            [0.62,'rgba(255,140,40,0.22)'],[1,'rgba(255,90,20,0)']]);
  SPR.fireMid = mkGlow(64, [[0,'rgba(255,226,168,1)'],[0.28,'rgba(255,160,60,0.60)'],
                            [0.62,'rgba(240,96,20,0.20)'],[1,'rgba(210,60,10,0)']]);
  SPR.fireLow = mkGlow(64, [[0,'rgba(255,190,120,1)'],[0.28,'rgba(230,110,36,0.52)'],
                            [0.62,'rgba(190,60,14,0.18)'],[1,'rgba(150,40,8,0)']]);
}

const PART_MAX = 260;
function emit(type, x, y, opt){
  opt = opt||{};
  const n = opt.n||1;
  for (let i=0;i<n;i++){
    if (S.parts.length > PART_MAX) S.parts.shift();
    const spread = opt.spread||0;
    const p = {
      type,
      x: x + rnd(-spread,spread),
      y: y + rnd(-spread*0.5, spread*0.5),
      vx: rnd(-(opt.vx||0), opt.vx||0),
      vy: opt.vy!==undefined ? rnd(opt.vy*0.5, opt.vy) : rnd(-90,-40),
      life: opt.life || rnd(.5,1.3),
      age: 0,
      r: opt.r || rnd(5,14),
      roll: rnd(-2,2),
      hue: opt.hue!==undefined ? opt.hue : rnd(16,44),
      alpha: opt.alpha!==undefined ? opt.alpha : 1
    };
    if (type === 'wood'){
      p.sx = x; p.sy = y;
      p.tx = opt.tx!==undefined ? opt.tx : x;
      p.ty = opt.ty!==undefined ? opt.ty : y;
      p.rot = rnd(-3,3);
      p.len = opt.len || rnd(16,26);
    }
    S.parts.push(p);
  }
}
function stepParts(dt){
  for (let i=S.parts.length-1;i>=0;i--){
    const p = S.parts[i];
    p.age += dt;
    if (p.age >= p.life){ S.parts.splice(i,1); continue; }
    if (p.type === 'wood'){
      const k = p.age / p.life;
      p.x = lerp(p.sx, p.tx, k);
      p.y = lerp(p.sy, p.ty, k) - Math.sin(k*Math.PI)*72;   // 抛物线
      p.rot += dt*9;
      continue;
    }
    p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.type==='fire'){ p.vy -= 34*dt; p.vx *= (1-1.7*dt); p.r += 15*dt; }
    else if (p.type==='smoke'){ p.vy -= 6*dt; p.vx += Math.sin(p.age*1.6+p.roll)*12*dt; p.r += 24*dt; }
    else if (p.type==='chip'){ p.vy += 620*dt; }
    else if (p.type==='ash'){ p.vy += 16*dt; p.vx += Math.sin(p.age*2.3+p.roll)*20*dt; }
  }
}
function drawParts(list, camX){
  ctx.save();
  for (let i=0;i<list.length;i++){
    const p = list[i];
    const k = 1 - p.age/p.life;
    const sx = p.x - camX, sy = p.y;
    if (sx < -80 || sx > W+80 || sy < -140 || sy > H+140) continue;
    ctx.globalAlpha = 1;
    if (p.type==='fire'){
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = clamp(k * p.alpha, 0, 1);
      const d = p.r*2;
      const spr = p.hue>36 ? SPR.fireHot : (p.hue>22 ? SPR.fireMid : SPR.fireLow);
      ctx.drawImage(spr, sx-p.r, sy-p.r, d, d);
    } else if (p.type==='wood'){
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = clamp(Math.min(1, k*2.2), 0, 1);
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(p.rot);
      ctx.fillStyle = '#7a5533';
      ctx.beginPath(); ctx.roundRect(-p.len/2, -4, p.len, 8, 4); ctx.fill();
      ctx.fillStyle = '#a37c4e';
      ctx.beginPath(); ctx.arc(p.len/2, 0, 4, 0, 6.2832); ctx.fill();
      ctx.restore();
    } else if (p.type==='smoke'){
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba('+(38+18*k|0)+','+(33+15*k|0)+','+(30+14*k|0)+','+(0.24*k)+')';
      ctx.beginPath(); ctx.arc(sx,sy,p.r,0,6.2832); ctx.fill();
    } else if (p.type==='chip'){
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(196,164,120,'+(0.9*k)+')';
      ctx.fillRect(sx,sy,3,2);
    } else if (p.type==='ash'){
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = (p.hue>40 ? 'rgba(255,150,60,' : 'rgba(140,130,124,')+(0.7*k*p.alpha)+')';
      ctx.fillRect(sx,sy,2.4,2.4);
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(226,240,255,'+(p.alpha*k)+')';
      ctx.beginPath(); ctx.arc(sx,sy,p.r,0,6.2832); ctx.fill();
    }
  }
  ctx.restore();
}

/* ============================================================
   4. 音效（WebAudio 合成）
   ============================================================ */
let AC=null, fireGain=null, fireSrc=null;
function initAudio(){
  if (AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    const bufSize = AC.sampleRate*2;
    const buf = AC.createBuffer(1, bufSize, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<bufSize;i++) d[i] = (Math.random()*2-1)*0.5;
    fireSrc = AC.createBufferSource(); fireSrc.buffer = buf; fireSrc.loop = true;
    const lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=320; lp.Q.value=0.7;
    fireGain = AC.createGain(); fireGain.gain.value = 0;
    fireSrc.connect(lp); lp.connect(fireGain); fireGain.connect(AC.destination);
    fireSrc.start();
  }catch(e){ AC=null; fireGain=null; fireSrc=null; }
}
function sfx(kind){
  if (!AC || AC.state==='suspended') return;
  const t = AC.currentTime;
  try{
    if (kind==='chop'){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type='triangle'; o.frequency.setValueAtTime(190,t);
      o.frequency.exponentialRampToValueAtTime(52,t+0.13);
      g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.18);
    } else if (kind==='feed'){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(90,t);
      o.frequency.exponentialRampToValueAtTime(280,t+0.18);
      g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.055,t+0.04);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+0.24);
    } else if (kind==='coin'){
      [880,1320].forEach((f,i)=>{
        const o = AC.createOscillator(), g = AC.createGain();
        o.type='square'; o.frequency.value=f;
        const st = t+i*0.08;
        g.gain.setValueAtTime(0.001,st); g.gain.linearRampToValueAtTime(0.05,st+0.01);
        g.gain.exponentialRampToValueAtTime(0.001,st+0.16);
        o.connect(g); g.connect(AC.destination); o.start(st); o.stop(st+0.18);
      });
    } else if (kind==='buy'){
      [523.25,659.25,880].forEach((f,i)=>{
        const o = AC.createOscillator(), g = AC.createGain();
        o.type='triangle'; o.frequency.value=f;
        const st = t+i*0.07;
        g.gain.setValueAtTime(0.001,st); g.gain.linearRampToValueAtTime(0.08,st+0.02);
        g.gain.exponentialRampToValueAtTime(0.001,st+0.42);
        o.connect(g); g.connect(AC.destination); o.start(st); o.stop(st+0.45);
      });
    } else if (kind==='boom' || kind==='stage'){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type='sine'; o.frequency.setValueAtTime(kind==='boom'?95:160,t);
      o.frequency.exponentialRampToValueAtTime(28,t+0.9);
      g.gain.setValueAtTime(0.28,t); g.gain.exponentialRampToValueAtTime(0.001,t+1.0);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+1.05);
    } else if (kind==='win'){
      [392,523.25,659.25,783.99].forEach((f,i)=>{
        const o = AC.createOscillator(), g = AC.createGain();
        o.type='sine'; o.frequency.value=f;
        const st = t+i*0.10;
        g.gain.setValueAtTime(0.001,st); g.gain.linearRampToValueAtTime(0.09,st+0.04);
        g.gain.exponentialRampToValueAtTime(0.001,st+1.5);
        o.connect(g); g.connect(AC.destination); o.start(st); o.stop(st+1.6);
      });
    }
  }catch(e){}
}
function updateFireAudio(){
  // AC 可能为 null 而 fireGain 已被赋过值：直接摸 AC.currentTime 会抛异常
  if (!AC || !fireGain) return;
  const target = S.scene==='xian' ? 0.10
    : (S.fuel>0 ? clamp(0.012 + S.fuel/FUEL_MAX*0.075, 0, 0.10) : 0);
  try { fireGain.gain.setTargetAtTime(target, AC.currentTime, 0.5); } catch(e){}
}
